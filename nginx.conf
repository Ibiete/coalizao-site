server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # O formulário envia para o NAIIAN ONE (tenant Bloom)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://painel.bloomocean.com.br; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # imagens e fontes têm nome estável; CSS/JS levam ?v= a cada build
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # PDFs (BrandBook, Guia de Comunicação...) ficam num volume da VPS, fora da imagem/git
    location /docs/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /en { return 301 /en/; }
    location = /politica-de-privacidade { return 301 /politica-de-privacidade/; }
    location = /en/privacy-policy { return 301 /en/privacy-policy/; }

    # Página do evento Ocean Decade Week 2027 (app do Lovable importado por
    # scripts/oceandecade.mjs). CSP própria: o app precisa de scripts embutidos
    # (liberados só por hash, regerados pelo script) e de estilos inline.
    location = /oceandecade { return 301 /oceandecade/; }

    location /oceandecade/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /oceandecade/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # >>> oceandecade-csp (gerado por scripts/oceandecade.mjs — não editar à mão)
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-zFML+AEdb/HsbX66VlYzBOqJKNNHs5/WNGYP8JiblyY=' 'sha256-10l9dG9NtCsieZCYZ00zGDwS8lRPTiOEva8XDmfTjLk=' 'sha256-REkTQ3mZNdOnZ0xWxlKdqBEAWdIVpJdIT6tm57gvq8Y='; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        # <<< oceandecade-csp
        try_files $uri $uri/ /oceandecade/index.html;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://painel.bloomocean.com.br; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
